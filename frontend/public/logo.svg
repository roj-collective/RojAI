<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Woven kilim mark — simplified from the original: red, olive, tan rectangles -->

  <!-- Tan / beige strands -->
  <rect x="72" y="54" width="56" height="16" rx="5" fill="#c9a87c" transform="rotate(-45 100 62)"/>
  <rect x="72" y="130" width="56" height="16" rx="5" fill="#c9a87c" transform="rotate(45 100 138)"/>
  <rect x="46" y="88" width="56" height="16" rx="5" fill="#c9a87c" transform="rotate(0 74 96)"/>
  <rect x="98" y="96" width="56" height="16" rx="5" fill="#c9a87c" transform="rotate(0 126 104)"/>

  <!-- Olive strands -->
  <rect x="88" y="36" width="14" height="14" rx="3" fill="#8a9a2e"/>
  <rect x="100" y="136" width="14" height="14" rx="3" fill="#8a9a2e"/>
  <rect x="48" y="96" width="14" height="14" rx="3" fill="#8a9a2e"/>
  <rect x="138" y="90" width="14" height="14" rx="3" fill="#8a9a2e"/>
  <rect x="80" y="148" width="14" height="14" rx="3" fill="#8a9a2e"/>
  <rect x="108" y="40" width="14" height="14" rx="3" fill="#8a9a2e"/>

  <!-- Red strands (dominant diagonal bars) -->
  <rect x="56" y="60" width="52" height="18" rx="6" fill="#c8132a" transform="rotate(45 82 69)"/>
  <rect x="92" y="60" width="52" height="18" rx="6" fill="#c8132a" transform="rotate(-45 118 69)"/>
  <rect x="56" y="114" width="52" height="18" rx="6" fill="#c8132a" transform="rotate(-45 82 123)"/>
  <rect x="92" y="114" width="52" height="18" rx="6" fill="#c8132a" transform="rotate(45 118 123)"/>
</svg>
